<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>입점자 미니홈 편집기 MVP</title>
  <style>
    :root{
      --app-bg:#f3f4f6;
      --panel:#ffffff;
      --line:#e5e7eb;
      --ink:#111827;
      --muted:#6b7280;
      --brand:#2563eb;
      --danger:#ef4444;
      --shadow:0 18px 45px rgba(15,23,42,.12);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
      background:var(--app-bg);
      color:var(--ink);
      overflow-x:hidden;
    }
    button,input,textarea,select{font:inherit}
    button{border:0;background:none;color:inherit;cursor:pointer}
    .app{
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }
    .topbar{
      position:sticky;
      top:0;
      z-index:1000;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px;
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line);
    }
    .top-left,.top-right{display:flex;align-items:center;gap:8px;min-width:0}
    .brand-title{
      font-weight:900;
      letter-spacing:-.04em;
      white-space:nowrap;
      font-size:16px;
    }
    .viewport-tabs{
      display:none;
      align-items:center;
      gap:4px;
      padding:3px;
      background:#eef2ff;
      border-radius:999px;
      border:1px solid #dbeafe;
    }
    .viewport-tab{
      padding:7px 12px;
      border-radius:999px;
      font-size:13px;
      font-weight:800;
      color:#334155;
    }
    .viewport-tab.active{
      background:#fff;
      box-shadow:0 4px 12px rgba(37,99,235,.18);
      color:#1d4ed8;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:5px;
      height:34px;
      padding:0 11px;
      border-radius:999px;
      background:#fff;
      border:1px solid var(--line);
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
      box-shadow:0 2px 8px rgba(15,23,42,.04);
    }
    .btn.primary{background:#111827;color:#fff;border-color:#111827}
    .btn.blue{background:#2563eb;color:#fff;border-color:#2563eb}
    .btn.danger{background:#fff;color:var(--danger);border-color:#fecaca}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .main{
      display:grid;
      grid-template-columns:1fr;
      flex:1;
      min-height:0;
    }
    .side{
      display:none;
      background:#fff;
      border-right:1px solid var(--line);
      padding:14px;
      overflow:auto;
    }
    .stage-wrap{
      position:relative;
      padding:14px 0 92px;
      overflow:auto;
      min-height:calc(100vh - 56px);
    }
    .stage-label{
      text-align:center;
      color:#64748b;
      font-size:12px;
      font-weight:800;
      margin:4px 0 10px;
    }
    .canvas-shell{
      width:max-content;
      margin:0 auto;
      padding:0;
      transform-origin:top center;
    }
    .editor-canvas{
      position:relative;
      width:390px;
      min-height:1500px;
      margin:0 auto;
      overflow:visible;
      background:var(--page-bg,#fff8f1);
      box-shadow:var(--shadow);
      border-radius:22px;
      --page-bg:#FFF8F1;
      --section-bg:#FFFFFF;
      --card-bg:#FFFDF9;
      --text-main:#2B2118;
      --text-sub:#7A6654;
      --primary:#8B5E3C;
      --primary-text:#FFFFFF;
      --accent:#F4A261;
      --border:#E8D8C8;
    }
    .editor-canvas.preview .edit-ui{display:none!important}
    .editor-canvas.preview [contenteditable]{outline:0!important}
    .editor-widget{
      position:absolute;
      box-sizing:border-box;
      touch-action:none;
      outline:0;
    }
    .editor-widget.selected{
      outline:2px solid #2563eb;
      outline-offset:3px;
    }
    .widget-move{
      position:absolute;
      left:-10px;
      top:-26px;
      display:none;
      height:23px;
      padding:0 8px;
      border-radius:999px;
      background:#2563eb;
      color:#fff;
      font-size:12px;
      font-weight:900;
      align-items:center;
      justify-content:center;
      box-shadow:0 8px 18px rgba(37,99,235,.26);
      cursor:grab;
      user-select:none;
      z-index:50;
    }
    .selected .widget-move{display:flex}
    .resize-handle{
      position:absolute;
      right:-10px;
      bottom:-10px;
      width:20px;
      height:20px;
      border-radius:50%;
      display:none;
      background:#fff;
      border:3px solid #2563eb;
      box-shadow:0 4px 12px rgba(15,23,42,.22);
      z-index:60;
      cursor:nwse-resize;
    }
    .selected .resize-handle{display:block}
    .mini-toolbar{
      position:absolute;
      right:-4px;
      top:-34px;
      display:none;
      align-items:center;
      gap:4px;
      z-index:70;
    }
    .selected .mini-toolbar{display:flex}
    .mini-btn{
      width:28px;
      height:28px;
      border-radius:999px;
      background:#fff;
      border:1px solid #dbeafe;
      box-shadow:0 7px 16px rgba(15,23,42,.12);
      font-size:13px;
      font-weight:900;
      color:#1e40af;
    }
    .mini-btn.danger{color:#dc2626;border-color:#fecaca}
    .editable{
      width:100%;
      height:100%;
      outline:0;
      white-space:pre-wrap;
      overflow:hidden;
      cursor:text;
    }
    .widget-text .editable:empty:before,
    .widget-button .editable:empty:before{
      content:attr(data-placeholder);
      color:rgba(100,116,139,.65);
    }
    .widget-image .image-box{
      width:100%;
      height:100%;
      border-radius:inherit;
      background:linear-gradient(135deg,#e5e7eb,#f8fafc);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#94a3b8;
      font-weight:900;
      font-size:14px;
      text-align:center;
      border:1px dashed rgba(100,116,139,.35);
    }
    .widget-image img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
    }
    .widget-button .button-box{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      text-align:center;
    }
    .widget-box .box-inner{
      width:100%;
      height:100%;
      background:var(--card-bg);
      border:1px solid var(--border);
      border-radius:inherit;
    }
    .widget-divider .divider-inner{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
    }
    .widget-divider .divider-line{
      width:100%;
      height:2px;
      background:var(--border);
      border-radius:99px;
    }
    .widget-menu .menu-card,
    .widget-gallery .gallery-card,
    .widget-hours .hours-card,
    .widget-map .map-card,
    .widget-contact .contact-card,
    .widget-coupon .coupon-card,
    .widget-video .video-card{
      width:100%;
      height:100%;
      background:var(--card-bg);
      border:1px solid var(--border);
      border-radius:inherit;
      padding:14px;
      overflow:hidden;
      color:var(--text-main);
    }
    .card-title{
      font-weight:900;
      letter-spacing:-.04em;
      margin-bottom:10px;
      outline:0;
    }
    .menu-list{display:flex;flex-direction:column;gap:8px}
    .menu-item{
      display:grid;
      grid-template-columns:52px 1fr auto;
      gap:10px;
      align-items:center;
      padding:8px;
      border-radius:14px;
      background:rgba(255,255,255,.58);
      border:1px solid rgba(148,163,184,.16);
    }
    .menu-thumb{
      width:52px;height:52px;border-radius:12px;background:#e5e7eb;
      display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:11px;font-weight:900;overflow:hidden;
    }
    .menu-name{font-weight:900;outline:0}
    .menu-desc{font-size:12px;color:var(--text-sub);outline:0;margin-top:2px}
    .menu-price{font-weight:900;color:var(--primary);outline:0;white-space:nowrap}
    .gallery-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      height:calc(100% - 34px);
    }
    .gallery-cell{
      border-radius:14px;
      background:#e5e7eb;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#94a3b8;
      font-weight:900;
      font-size:12px;
      overflow:hidden;
    }
    .gallery-cell img{width:100%;height:100%;object-fit:cover}
    .hours-row,.map-row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:7px 0;
      border-bottom:1px solid rgba(148,163,184,.2);
      font-size:14px;
    }
    .hours-row span,.map-row span{outline:0}
    .contact-actions{display:flex;gap:8px;flex-wrap:wrap}
    .contact-pill{
      flex:1 1 120px;
      min-height:42px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      background:var(--primary);
      color:var(--primary-text);
      font-weight:900;
      outline:0;
    }
    .coupon-card{
      background:linear-gradient(135deg,var(--primary),var(--accent))!important;
      color:var(--primary-text)!important;
      border:0!important;
    }
    .coupon-big{font-size:25px;font-weight:950;letter-spacing:-.05em;outline:0}
    .coupon-small{margin-top:8px;font-size:14px;font-weight:700;opacity:.88;outline:0}
    .video-frame{
      width:100%;
      height:calc(100% - 36px);
      border:0;
      border-radius:14px;
      background:#111827;
      overflow:hidden;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:12px;
      font-weight:900;
      line-height:1.35;
    }
    .video-frame iframe{width:100%;height:100%;border:0;border-radius:14px}
    .video-url{
      margin-top:8px;
      width:100%;
      border:1px solid var(--border);
      border-radius:12px;
      padding:9px 10px;
      outline:0;
      font-size:12px;
    }
    .panel-title{
      font-weight:950;
      letter-spacing:-.05em;
      margin:4px 0 12px;
      font-size:18px;
    }
    .panel-section{
      margin-bottom:18px;
      padding-bottom:16px;
      border-bottom:1px solid var(--line);
    }
    .tool-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:8px;
    }
    .tool-card{
      min-height:52px;
      border:1px solid #e5e7eb;
      border-radius:15px;
      background:#fff;
      font-size:13px;
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:8px;
    }
    .tool-card:active{transform:scale(.98)}
    .palette-list{display:flex;flex-direction:column;gap:8px}
    .palette-card{
      padding:10px;
      border:1px solid #e5e7eb;
      border-radius:15px;
      background:#fff;
      text-align:left;
    }
    .palette-card.active{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.12)}
    .palette-name{font-size:13px;font-weight:950;margin-bottom:7px}
    .palette-sub{font-size:11px;color:#64748b;font-weight:800;margin-top:-4px;margin-bottom:7px}
    .swatches{display:flex;gap:5px}
    .swatches span{width:22px;height:22px;border-radius:999px;border:1px solid rgba(0,0,0,.08)}
    .template-card{
      width:100%;
      text-align:left;
      padding:12px;
      border-radius:15px;
      border:1px solid var(--line);
      background:#fff;
      margin-bottom:8px;
    }
    .template-card strong{display:block;font-size:14px}
    .template-card small{color:#64748b;font-weight:700}
    .bottom-bar{
      position:fixed;
      left:0;right:0;bottom:0;
      z-index:1000;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:6px;
      padding:10px 10px calc(10px + env(safe-area-inset-bottom));
      background:rgba(255,255,255,.96);
      backdrop-filter:blur(14px);
      border-top:1px solid var(--line);
    }
    .bottom-btn{
      height:46px;
      border-radius:14px;
      background:#f8fafc;
      border:1px solid #e5e7eb;
      font-weight:950;
      font-size:13px;
      color:#334155;
    }
    .bottom-btn.active{background:#111827;color:#fff;border-color:#111827}
    .sheet{
      position:fixed;
      left:10px;right:10px;bottom:76px;
      z-index:999;
      max-height:62vh;
      overflow:auto;
      border-radius:22px;
      background:#fff;
      border:1px solid var(--line);
      box-shadow:0 18px 50px rgba(15,23,42,.22);
      padding:14px;
      display:none;
    }
    .sheet.open{display:block}
    .toast{
      position:fixed;
      left:50%;
      bottom:92px;
      transform:translateX(-50%);
      z-index:2000;
      background:#111827;
      color:#fff;
      padding:11px 15px;
      border-radius:999px;
      font-size:13px;
      font-weight:800;
      box-shadow:0 15px 40px rgba(0,0,0,.24);
      display:none;
      max-width:90vw;
      text-align:center;
    }
    .toast.show{display:block}
    .input-row{display:flex;gap:8px;margin-top:8px}
    .input-row input{
      flex:1;
      min-width:0;
      border:1px solid var(--line);
      border-radius:13px;
      padding:10px;
      outline:0;
    }
    .note{
      padding:10px 12px;
      border-radius:15px;
      background:#f8fafc;
      border:1px solid #e5e7eb;
      color:#475569;
      font-size:12px;
      font-weight:750;
      line-height:1.45;
      margin-bottom:12px;
    }
    @media (min-width:900px){
      .viewport-tabs{display:flex}
      .main{
        grid-template-columns:260px 1fr;
      }
      .side{display:block}
      .stage-wrap{padding:18px 20px 60px}
      .bottom-bar,.sheet{display:none!important}
      .brand-title{font-size:17px}
      .topbar{padding:11px 16px}
      .editor-canvas.desktop-canvas{border-radius:18px}
    }
    @media (max-width:430px){
      .stage-wrap{padding-left:0;padding-right:0}
      .editor-canvas{border-radius:0;box-shadow:none}
      .canvas-shell{width:100%}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="top-left">
      <div class="brand-title">입점자 미니홈 편집기</div>
      <div id="viewportTabs" class="viewport-tabs">
        <button class="viewport-tab active" data-vp="mobile">모바일</button>
        <button class="viewport-tab" data-vp="desktop">데스크탑</button>
      </div>
    </div>
    <div class="top-right">
      <button class="btn" id="undoBtn">↶</button>
      <button class="btn" id="redoBtn">↷</button>
      <button class="btn" id="previewBtn">미리보기</button>
      <button class="btn blue" id="saveBtn">저장</button>
    </div>
  </header>

  <main class="main">
    <aside class="side">
      <div class="panel-section">
        <div class="panel-title">템플릿</div>
        <div id="templatePanel"></div>
      </div>
      <div class="panel-section">
        <div class="panel-title">위젯 추가</div>
        <div id="widgetPanel" class="tool-grid"></div>
      </div>
      <div class="panel-section">
        <div class="panel-title">색상 팔레트</div>
        <div class="note">같은 팔레트를 다시 누르면 색조합이 로테이션됩니다.</div>
        <div id="palettePanel" class="palette-list"></div>
      </div>
    </aside>

    <section class="stage-wrap" id="stageWrap">
      <div id="stageLabel" class="stage-label">모바일 화면 편집 중</div>
      <div class="canvas-shell">
        <div id="editorCanvas" class="editor-canvas"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-bar">
    <button class="bottom-btn active" data-panel="widgets">위젯</button>
    <button class="bottom-btn" data-panel="templates">템플릿</button>
    <button class="bottom-btn" data-panel="colors">색상</button>
    <button class="bottom-btn" data-panel="more">도구</button>
  </nav>

  <div id="sheet" class="sheet"></div>
  <div id="toast" class="toast"></div>
</div>

<script>
(function(){
  const STORAGE_KEY = "tenant_store_editor_mvp_v1";
  const DESKTOP_BREAKPOINT = 900;
  const canvasEl = document.getElementById("editorCanvas");
  const stageLabel = document.getElementById("stageLabel");
  const viewportTabs = document.getElementById("viewportTabs");
  const sheet = document.getElementById("sheet");
  const toast = document.getElementById("toast");

  const PALETTE_GROUPS = [
    {
      id:"cafe_warm", name:"따뜻한 카페", category:"카페/디저트",
      rotations:[
        {name:"크림 브라운",colors:{pageBg:"#FFF8F1",sectionBg:"#FFFFFF",cardBg:"#FFFDF9",textMain:"#2B2118",textSub:"#7A6654",primary:"#8B5E3C",primaryText:"#FFFFFF",accent:"#F4A261",border:"#E8D8C8"}},
        {name:"화이트 카라멜",colors:{pageBg:"#FFFFFF",sectionBg:"#FFF6EA",cardBg:"#FFFFFF",textMain:"#2A1A12",textSub:"#846850",primary:"#B8793E",primaryText:"#FFFFFF",accent:"#E6B17E",border:"#EAD8C5"}},
        {name:"에스프레소",colors:{pageBg:"#24180F",sectionBg:"#332217",cardBg:"#4A3122",textMain:"#FFF7EF",textSub:"#D9C3AD",primary:"#D6A15D",primaryText:"#24180F",accent:"#F3C77B",border:"#6A4A35"}}
      ]
    },
    {
      id:"fresh_market", name:"싱그러운 로컬", category:"농산물/마트",
      rotations:[
        {name:"초록 장터",colors:{pageBg:"#F7FBF2",sectionBg:"#FFFFFF",cardBg:"#F0F8E8",textMain:"#1F2F1F",textSub:"#65765F",primary:"#5A9E45",primaryText:"#FFFFFF",accent:"#F2C94C",border:"#D7E8C8"}},
        {name:"토마토 포인트",colors:{pageBg:"#FFFDF4",sectionBg:"#FFFFFF",cardBg:"#F7FFE8",textMain:"#24301E",textSub:"#68715F",primary:"#E4503A",primaryText:"#FFFFFF",accent:"#76B947",border:"#DFE8C9"}},
        {name:"딥 그린",colors:{pageBg:"#142218",sectionBg:"#1B3323",cardBg:"#24452F",textMain:"#F4FFF6",textSub:"#BBD5C1",primary:"#A8D672",primaryText:"#142218",accent:"#F5CE52",border:"#3B6547"}}
      ]
    },
    {
      id:"beauty_pink", name:"뷰티 핑크", category:"뷰티",
      rotations:[
        {name:"소프트 핑크",colors:{pageBg:"#FFF5F8",sectionBg:"#FFFFFF",cardBg:"#FFF0F5",textMain:"#3A1F2B",textSub:"#8A5B6B",primary:"#E85D8C",primaryText:"#FFFFFF",accent:"#FFC2D4",border:"#F5D5DF"}},
        {name:"로즈 골드",colors:{pageBg:"#FFF9F7",sectionBg:"#FFFFFF",cardBg:"#FFF1EE",textMain:"#3A2621",textSub:"#8A6A64",primary:"#C76C64",primaryText:"#FFFFFF",accent:"#E6B8A8",border:"#F0D3CC"}},
        {name:"모브",colors:{pageBg:"#F8F2FF",sectionBg:"#FFFFFF",cardBg:"#F1E8FF",textMain:"#2F2440",textSub:"#71657F",primary:"#8B5CF6",primaryText:"#FFFFFF",accent:"#C4B5FD",border:"#DDD1F5"}}
      ]
    },
    {
      id:"premium_black", name:"프리미엄 블랙", category:"프리미엄",
      rotations:[
        {name:"블랙 골드",colors:{pageBg:"#0E0E0E",sectionBg:"#171717",cardBg:"#222222",textMain:"#F7F7F7",textSub:"#B8B8B8",primary:"#D6B36A",primaryText:"#111111",accent:"#FFFFFF",border:"#333333"}},
        {name:"차콜 실버",colors:{pageBg:"#15171A",sectionBg:"#20242A",cardBg:"#2B3038",textMain:"#F8FAFC",textSub:"#CBD5E1",primary:"#CBD5E1",primaryText:"#111827",accent:"#94A3B8",border:"#3B4350"}},
        {name:"네이비 럭스",colors:{pageBg:"#0F172A",sectionBg:"#16213A",cardBg:"#1E2D4D",textMain:"#F8FAFC",textSub:"#CBD5E1",primary:"#F8C471",primaryText:"#111827",accent:"#60A5FA",border:"#334155"}}
      ]
    },
    {
      id:"clean_blue", name:"클린 블루", category:"교육/병원",
      rotations:[

  function getNextZIndex(){
    const max = Math.max(0, ...(pageDraft?.widgets||[]).map(w=>w.zIndex||1));
    return max + 1;
  }

  function getDeviceType(){ return window.innerWidth >= DESKTOP_BREAKPOINT ? "desktop" : "mobile"; }

  function canEditViewport(vp){
    return editorState.deviceType === "desktop" || vp === "mobile";
  }

  function setActiveViewport(vp){
    if(!canEditViewport(vp)){
      showToast("데스크탑 화면 편집은 PC에서 가능합니다.");
      return;
    }
    editorState.activeViewport = vp;
    editorState.selectedWidgetId = null;
    render();
  }

  function getCanvasPreset(){
    return pageDraft.canvas[editorState.activeViewport];
  }

  function render(){
    editorState.deviceType = getDeviceType();
    if(editorState.deviceType === "mobile") editorState.activeViewport = "mobile";
    ensureAllLayouts();
    applyColors(pageDraft.colors);
    renderPanels();
    renderCanvas();
    updateViewportTabs();
  }

  function renderCanvas(){
    const vp = editorState.activeViewport;
    const canvas = getCanvasPreset();
    canvasEl.className = "editor-canvas" + (editorState.preview ? " preview" : "") + (vp==="desktop" ? " desktop-canvas" : "");
    canvasEl.style.width = canvas.width + "px";
    canvasEl.style.minHeight = canvas.minHeight + "px";
    stageLabel.textContent = vp === "mobile" ? "모바일 화면 편집 중" : "데스크탑 화면 편집 중";
    canvasEl.innerHTML = "";
    pageDraft.widgets
      .filter(w => w.visible?.[vp] !== false)
      .sort((a,b)=>(a.zIndex||1)-(b.zIndex||1))
      .forEach(w => canvasEl.appendChild(createWidgetElement(w, vp)));
    applyColors(pageDraft.colors);
  }

  function createWidgetElement(widget, vp){
    const layout = widget.responsive[vp];
    const el = document.createElement("div");
    el.className = "editor-widget widget-" + widget.type + (editorState.selectedWidgetId===widget.id ? " selected" : "");
    el.dataset.id = widget.id;
    el.style.left = layout.x + "px";
    el.style.top = layout.y + "px";
    el.style.width = layout.width + "px";
    el.style.height = layout.height + "px";
    el.style.zIndex = widget.zIndex || 1;
    if(widget.rotate) el.style.transform = `rotate(${widget.rotate}deg)`;
    el.addEventListener("pointerdown", e => {
      if(editorState.preview) return;
      editorState.selectedWidgetId = widget.id;
      render();
      e.stopPropagation();
    });

    el.appendChild(renderWidgetContent(widget, layout));

    if(!editorState.preview){
      const move = document.createElement("div");
      move.className = "widget-move edit-ui";
      move.textContent = "이동";
      move.addEventListener("pointerdown", e => startDrag(e, widget.id));
      el.appendChild(move);

      const resize = document.createElement("div");
      resize.className = "resize-handle edit-ui";
      resize.addEventListener("pointerdown", e => startResize(e, widget.id));
      el.appendChild(resize);

      const toolbar = document.createElement("div");
      toolbar.className = "mini-toolbar edit-ui";
      toolbar.innerHTML = `
        <button class="mini-btn" title="복제" data-act="dup">⧉</button>
        <button class="mini-btn" title="앞으로" data-act="front">↑</button>
        <button class="mini-btn" title="뒤로" data-act="back">↓</button>
        <button class="mini-btn danger" title="삭제" data-act="del">×</button>
      `;
      toolbar.addEventListener("pointerdown", e => e.stopPropagation());
      toolbar.addEventListener("click", e => {
        const btn = e.target.closest("button");
        if(!btn) return;
        const act = btn.dataset.act;
        if(act==="dup") duplicateWidget(widget.id);
        if(act==="front") bringForward(widget.id);
        if(act==="back") sendBackward(widget.id);
        if(act==="del") deleteWidget(widget.id);
      });
      el.appendChild(toolbar);
    }
    return el;
  }

  function renderWidgetContent(widget, layout){
    const d = document.createElement("div");
    const type = widget.type;
    if(type==="text"){
      d.className = "editable";
      d.contentEditable = !editorState.preview;
      d.dataset.placeholder = widget.props.placeholder || "텍스트";
      d.innerText = widget.props.text || "";
      d.style.fontSize = (layout.fontSize || 24) + "px";
      d.style.fontWeight = widget.styles.fontWeight || 700;
      d.style.lineHeight = widget.styles.lineHeight || 1.2;
      d.style.color = widget.styles.color || "var(--text-main)";
      d.style.textAlign = widget.styles.textAlign || "left";
      d.addEventListener("input", () => {
        widget.props.text = d.innerText;
        scheduleSave();
      });
      d.addEventListener("pointerdown", e => e.stopPropagation());
    }else if(type==="image"){
      d.className = "image-box";
      d.style.borderRadius = (widget.styles.radius ?? 20) + "px";
      if(widget.props.imageUrl){
        const img = document.createElement("img");
        img.src = widget.props.imageUrl;
        img.alt = widget.props.alt || "";
        d.appendChild(img);
      }else{
        d.innerHTML = `<div>이미지<br><small>선택 후 URL 입력</small></div>`;
      }
      d.addEventListener("dblclick", () => promptImage(widget.id));
    }else if(type==="button"){
      d.className = "button-box";
      d.style.borderRadius = (widget.styles.radius ?? 999) + "px";
      d.style.background = widget.styles.background || "var(--primary)";
      d.style.color = widget.styles.color || "var(--primary-text)";
      d.style.fontWeight = widget.styles.fontWeight || 900;
      d.style.fontSize = (layout.fontSize || 16) + "px";
      const inner = document.createElement("div");
      inner.className = "editable";
      inner.contentEditable = !editorState.preview;
      inner.dataset.placeholder = "버튼";
      inner.innerText = widget.props.text || "";
      inner.addEventListener("input", () => { widget.props.text = inner.innerText; scheduleSave(); });
      inner.addEventListener("pointerdown", e => e.stopPropagation());
      d.appendChild(inner);
    }else if(type==="box"){
      d.className = "box-inner";
      d.style.borderRadius = (widget.styles.radius ?? 20) + "px";
    }else if(type==="divider"){
      d.className = "divider-inner";
      d.innerHTML = `<div class="divider-line"></div>`;
    }else if(type==="menu"){
      d.className = "menu-card";
      d.style.borderRadius = (widget.styles.radius ?? 22) + "px";
      d.innerHTML = `<div class="card-title" contenteditable="${!editorState.preview}"></div><div class="menu-list"></div>`;
      const title = d.querySelector(".card-title");
      title.innerText = widget.props.title || "대표 메뉴";
      title.addEventListener("input",()=>{widget.props.title=title.innerText;scheduleSave();});
      title.addEventListener("pointerdown", e=>e.stopPropagation());
      const list = d.querySelector(".menu-list");
      widget.props.items.forEach((item,idx)=>{
        const row = document.createElement("div");
        row.className = "menu-item";
        row.innerHTML = `
          <div class="menu-thumb">사진</div>
          <div>
            <div class="menu-name" contenteditable="${!editorState.preview}"></div>
            <div class="menu-desc" contenteditable="${!editorState.preview}"></div>
          </div>
          <div class="menu-price" contenteditable="${!editorState.preview}"></div>
        `;
        const name = row.querySelector(".menu-name");
        const desc = row.querySelector(".menu-desc");
        const price = row.querySelector(".menu-price");
        name.innerText = item.name || "";
        desc.innerText = item.desc || "";
        price.innerText = item.price || "";
        [name,desc,price].forEach(node=>node.addEventListener("pointerdown", e=>e.stopPropagation()));
        name.addEventListener("input",()=>{item.name=name.innerText;scheduleSave();});
        desc.addEventListener("input",()=>{item.desc=desc.innerText;scheduleSave();});
        price.addEventListener("input",()=>{item.price=price.innerText;scheduleSave();});
        list.appendChild(row);
      });
    }else if(type==="gallery"){
      d.className = "gallery-card";
      d.style.borderRadius = (widget.styles.radius ?? 22) + "px";
      d.innerHTML = `<div class="card-title" contenteditable="${!editorState.preview}"></div><div class="gallery-grid"></div>`;
      const title = d.querySelector(".card-title");
      title.innerText = widget.props.title || "사진 모음";
      title.addEventListener("input",()=>{widget.props.title=title.innerText;scheduleSave();});
      title.addEventListener("pointerdown", e=>e.stopPropagation());
      const grid = d.querySelector(".gallery-grid");
      (widget.props.images||[]).slice(0,6).forEach((url,i)=>{
        const cell = document.createElement("div");
        cell.className = "gallery-cell";
        cell.textContent = "사진";
        if(url){ cell.innerHTML = `<img src="${escapeAttr(url)}" alt="">`; }
        cell.addEventListener("dblclick",()=>promptGalleryImage(widget.id,i));
        grid.appendChild(cell);
      });
    }else if(type==="hours"){
      d.className = "hours-card";
      d.style.borderRadius = (widget.styles.radius ?? 22) + "px";
      d.appendChild(editableTitle(widget,"title",widget.props.title || "영업시간"));
      (widget.props.rows||[]).forEach(row=>{
        const r = document.createElement("div");
        r.className = "hours-row";
        const day = editableSpan(row,"day",row.day);
        const time = editableSpan(row,"time",row.time);
        r.append(day,time);
        d.appendChild(r);
      });
    }else if(type==="map"){
      d.className = "map-card";
      d.style.borderRadius = (widget.styles.radius ?? 22) + "px";
      d.appendChild(editableTitle(widget,"title",widget.props.title || "오시는 길"));
      const r1 = document.createElement("div");
      r1.className = "map-row";
      r1.append(labelSpan("주소"), editablePropSpan(widget.props,"address",widget.props.address||"주소를 입력하세요"));
      const r2 = document.createElement("div");
      r2.className = "map-row";
      r2.append(labelSpan("주차"), editablePropSpan(widget.props,"parking",widget.props.parking||"주차 안내를 입력하세요"));
      d.append(r1,r2);
    }else if(type==="contact"){
      d.className = "contact-card";
      d.style.borderRadius = (widget.styles.radius ?? 22) + "px";
      d.appendChild(editableTitle(widget,"title",widget.props.title || "문의하기"));
      const actions = document.createElement("div");
      actions.className = "contact-actions";
      const phone = document.createElement("div");
      phone.className = "contact-pill";
      phone.contentEditable = !editorState.preview;
      phone.innerText = widget.props.phone || "전화하기";
      const kakao = document.createElement("div");
      kakao.className = "contact-pill";
      kakao.contentEditable = !editorState.preview;
      kakao.innerText = widget.props.kakao || "카카오 문의";
      phone.addEventListener("pointerdown",e=>e.stopPropagation());
      kakao.addEventListener("pointerdown",e=>e.stopPropagation());
      phone.addEventListener("input",()=>{widget.props.phone=phone.innerText;scheduleSave();});
      kakao.addEventListener("input",()=>{widget.props.kakao=kakao.innerText;scheduleSave();});
      actions.append(phone,kakao);
      d.appendChild(actions);
    }else if(type==="coupon"){
      d.className = "coupon-card";
      d.style.borderRadius = (widget.styles.radius ?? 24) + "px";
      d.innerHTML = `<div class="coupon-big" contenteditable="${!editorState.preview}"></div><div class="coupon-small" contenteditable="${!editorState.preview}"></div>`;
      const big = d.querySelector(".coupon-big");
      const small = d.querySelector(".coupon-small");
      big.innerText = widget.props.title || "첫 방문 혜택";
      small.innerText = widget.props.desc || "이 화면을 보여주시면 할인";
      big.addEventListener("pointerdown",e=>e.stopPropagation());
      small.addEventListener("pointerdown",e=>e.stopPropagation());
      big.addEventListener("input",()=>{widget.props.title=big.innerText;scheduleSave();});
      small.addEventListener("input",()=>{widget.props.desc=small.innerText;scheduleSave();});
    }else if(type==="video"){
      d.className = "video-card";
      d.style.borderRadius = (widget.styles.radius ?? 22) + "px";
      d.appendChild(editableTitle(widget,"title",widget.props.title || "영상"));
      const frame = document.createElement("div");
      frame.className = "video-frame";
      if(widget.props.embedUrl){
        frame.innerHTML = `<iframe src="${escapeAttr(widget.props.embedUrl)}" allowfullscreen></iframe>`;
      }else{
        frame.innerHTML = `영상 링크를 입력하세요<br><small>유튜브는 미리보기, 그 외는 링크 카드</small>`;
      }
      d.appendChild(frame);
      if(!editorState.preview){
        const row = document.createElement("div");
        row.className = "input-row";
        row.innerHTML = `<input value="${escapeAttr(widget.props.videoUrl||"")}" placeholder="유튜브/인스타/틱톡/네이버TV 링크"><button class="btn primary">적용</button>`;
        const input = row.querySelector("input");
        row.querySelector("button").addEventListener("click",()=>applyVideoUrl(widget.id,input.value));
        input.addEventListener("pointerdown",e=>e.stopPropagation());
        d.appendChild(row);
      }
    }
    return d;
  }

  function editableTitle(widget,key,value){
    const t = document.createElement("div");
    t.className = "card-title";
    t.contentEditable = !editorState.preview;
    t.innerText = value;
    t.addEventListener("pointerdown", e=>e.stopPropagation());
    t.addEventListener("input",()=>{widget.props[key]=t.innerText;scheduleSave();});
    return t;
  }
  function editableSpan(obj,key,value){
    const s = document.createElement("span");
    s.contentEditable = !editorState.preview;
    s.innerText = value || "";
    s.addEventListener("pointerdown", e=>e.stopPropagation());
    s.addEventListener("input",()=>{obj[key]=s.innerText;scheduleSave();});
    return s;
  }
  function editablePropSpan(obj,key,value){ return editableSpan(obj,key,value); }
  function labelSpan(txt){ const s=document.createElement("span"); s.textContent=txt; s.style.fontWeight="900"; return s; }

  function renderPanels(){
    renderWidgetPanel(document.getElementById("widgetPanel"));
    renderPalettePanel(document.getElementById("palettePanel"));
    renderTemplatePanel(document.getElementById("templatePanel"));
    renderMobileSheet();
  }

  function renderWidgetPanel(target){
    if(!target) return;
    target.innerHTML = "";
    WIDGETS.forEach(([type,label])=>{
      const btn = document.createElement("button");
      btn.className = "tool-card";
      btn.textContent = label;
      btn.onclick = () => addWidget(type);
      target.appendChild(btn);
    });
  }

  function renderPalettePanel(target){
    if(!target) return;
    target.innerHTML = "";
    PALETTE_GROUPS.forEach(group=>{
      const rot = group.rotations[pageDraft.paletteGroupId===group.id ? pageDraft.paletteRotationIndex : 0];
      const c = rot.colors;
      const btn = document.createElement("button");
      btn.className = "palette-card" + (pageDraft.paletteGroupId===group.id ? " active" : "");
      btn.innerHTML = `
        <div class="palette-name">${group.name}</div>
        <div class="palette-sub">${rot.name} ${pageDraft.paletteGroupId===group.id ? (pageDraft.paletteRotationIndex+1)+"/"+group.rotations.length : "1/"+group.rotations.length}</div>
        <div class="swatches">
          <span style="background:${c.pageBg}"></span>
          <span style="background:${c.cardBg}"></span>
          <span style="background:${c.textMain}"></span>
          <span style="background:${c.primary}"></span>
          <span style="background:${c.accent}"></span>
        </div>`;
      btn.onclick = () => selectPaletteGroup(group.id);
      target.appendChild(btn);
    });
  }

  function renderTemplatePanel(target){
    if(!target) return;
    target.innerHTML = "";
    TEMPLATES.forEach(t=>{
      const btn = document.createElement("button");
      btn.className = "template-card";
      btn.innerHTML = `<strong>${t.name}</strong><small>${t.desc}</small>`;
      btn.onclick = () => applyTemplate(t.id);
      target.appendChild(btn);
    });
  }

  function renderMobileSheet(){
    if(editorState.deviceType === "desktop") return;
    const panel = editorState.activePanel;
    const btns = document.querySelectorAll(".bottom-btn");
    btns.forEach(b => b.classList.toggle("active", b.dataset.panel === panel));
    if(panel === "widgets"){
      sheet.className = "sheet open";
      sheet.innerHTML = `<div class="panel-title">위젯 추가</div><div id="sheetWidgets" class="tool-grid"></div>`;
      renderWidgetPanel(document.getElementById("sheetWidgets"));
    }else if(panel === "templates"){
      sheet.className = "sheet open";
      sheet.innerHTML = `<div class="panel-title">템플릿</div><div id="sheetTemplates"></div>`;
      renderTemplatePanel(document.getElementById("sheetTemplates"));
    }else if(panel === "colors"){
      sheet.className = "sheet open";
      sheet.innerHTML = `<div class="panel-title">색상 팔레트</div><div class="note">같은 팔레트를 다시 누르면 색조합이 바뀝니다.</div><div id="sheetPalettes" class="palette-list"></div>`;
      renderPalettePanel(document.getElementById("sheetPalettes"));
    }else if(panel === "more"){
      sheet.className = "sheet open";
      sheet.innerHTML = `
        <div class="panel-title">도구</div>
        <div class="tool-grid">
          <button class="tool-card" id="mUndo">되돌리기</button>
          <button class="tool-card" id="mRedo">다시하기</button>
          <button class="tool-card" id="mPreview">미리보기</button>
          <button class="tool-card" id="mSave">저장</button>
        </div>
        <div class="note" style="margin-top:12px;">모바일에서는 모바일 화면만 편집됩니다. 데스크탑 화면 편집은 PC에서 가능합니다.</div>
      `;
      document.getElementById("mUndo").onclick=undo;
      document.getElementById("mRedo").onclick=redo;
      document.getElementById("mPreview").onclick=togglePreview;
      document.getElementById("mSave").onclick=saveNow;
    }else{
      sheet.className = "sheet";
    }
  }

  function updateViewportTabs(){
    viewportTabs.style.display = editorState.deviceType === "desktop" ? "flex" : "none";
    viewportTabs.querySelectorAll(".viewport-tab").forEach(btn=>{
      btn.classList.toggle("active", btn.dataset.vp === editorState.activeViewport);
    });
  }

  function addWidget(type){
    pushHistory();
    const vp = editorState.activeViewport;
    const baseY = Math.max(70, Math.round((document.getElementById("stageWrap").scrollTop || window.scrollY) + 120));
    let mobileLayout;
    if(vp==="mobile"){
      mobileLayout = {x:24,y:baseY,width:340,height:defaultHeight(type),fontSize:type==="text"?24:undefined};
    }else{
      mobileLayout = {x:24,y:Math.round(baseY/1.8),width:340,height:defaultHeight(type),fontSize:type==="text"?24:undefined};
    }
    const widget = defaultWidget(type,{mobile:mobileLayout});
    if(vp==="desktop"){
      widget.responsive.desktop = {x:80,y:baseY,width:type==="button"?220:520,height:defaultHeight(type)*1.2,fontSize:type==="text"?36:undefined};
    }
    pageDraft.widgets.push(widget);
    editorState.selectedWidgetId = widget.id;
    updateCanvasHeight("mobile");
    updateCanvasHeight("desktop");
    scheduleSave();
    render();
    showToast("위젯을 추가했습니다.");
  }

  function defaultHeight(type){
    return {text:80,image:220,button:54,box:180,divider:30,menu:360,gallery:280,hours:220,map:180,contact:130,coupon:150,video:300}[type] || 100;
  }

  function selectPaletteGroup(groupId){
    pushHistory();
    if(pageDraft.paletteGroupId === groupId){
      rotatePalette(false);
      return;
    }
    const group = PALETTE_GROUPS.find(p=>p.id===groupId);
    pageDraft.paletteGroupId = groupId;
    pageDraft.paletteRotationIndex = 0;
    pageDraft.colors = deepClone(group.rotations[0].colors);
    applyColors(pageDraft.colors);
    scheduleSave();
    render();
  }

  function rotatePalette(withHistory=true){
    if(withHistory) pushHistory();
    const group = PALETTE_GROUPS.find(p=>p.id===pageDraft.paletteGroupId);
    if(!group) return;
    pageDraft.paletteRotationIndex = (pageDraft.paletteRotationIndex + 1) % group.rotations.length;
    pageDraft.colors = deepClone(group.rotations[pageDraft.paletteRotationIndex].colors);
    applyColors(pageDraft.colors);
    scheduleSave();
    render();
  }

  function applyTemplate(id){
    if(!confirm("현재 편집 내용을 템플릿으로 교체할까요?")) return;
    pushHistory();
    pageDraft.widgets = createTemplateWidgets(id);
    updateCanvasHeight("mobile");
    updateCanvasHeight("desktop");
    editorState.selectedWidgetId = null;
    scheduleSave();
    render();
  }

  function applyColors(colors){
    const root = canvasEl;
    if(!root || !colors) return;
    root.style.setProperty("--page-bg", colors.pageBg);
    root.style.setProperty("--section-bg", colors.sectionBg);
    root.style.setProperty("--card-bg", colors.cardBg);
    root.style.setProperty("--text-main", colors.textMain);
    root.style.setProperty("--text-sub", colors.textSub);
    root.style.setProperty("--primary", colors.primary);
    root.style.setProperty("--primary-text", colors.primaryText);
    root.style.setProperty("--accent", colors.accent);
    root.style.setProperty("--border", colors.border);
  }

  function startDrag(e, id){
    if(editorState.preview) return;
    e.preventDefault(); e.stopPropagation();
    const w = findWidget(id);
    const layout = w.responsive[editorState.activeViewport];
    editorState.dragging = {
      id, startX:layout.x, startY:layout.y, pointerX:e.clientX, pointerY:e.clientY
    };
    e.target.setPointerCapture?.(e.pointerId);
  }

  function startResize(e, id){
    if(editorState.preview) return;
    e.preventDefault(); e.stopPropagation();
    const w = findWidget(id);
    const layout = w.responsive[editorState.activeViewport];
    editorState.resizing = {
      id, startW:layout.width, startH:layout.height, pointerX:e.clientX, pointerY:e.clientY
    };
    e.target.setPointerCapture?.(e.pointerId);
  }

  window.addEventListener("pointermove", e=>{
    if(editorState.dragging){
      const d = editorState.dragging;
      const dx = e.clientX - d.pointerX;
      const dy = e.clientY - d.pointerY;
      updateWidgetLayout(d.id,{x:Math.round(d.startX+dx),y:Math.round(d.startY+dy)},false);
      renderCanvas();
    }
    if(editorState.resizing){
      const r = editorState.resizing;
      const dx = e.clientX - r.pointerX;
      const dy = e.clientY - r.pointerY;
      updateWidgetLayout(r.id,{width:Math.max(40,Math.round(r.startW+dx)),height:Math.max(28,Math.round(r.startH+dy))},false);
      renderCanvas();
    }
  });

  window.addEventListener("pointerup", ()=>{
    if(editorState.dragging || editorState.resizing){
      pushHistory();
      editorState.dragging = null;
      editorState.resizing = null;
      updateCanvasHeight(editorState.activeViewport);
      scheduleSave();
      render();
    }
  });

  canvasEl.addEventListener("pointerdown", ()=>{
    if(editorState.preview) return;
    editorState.selectedWidgetId = null;
    render();
  });

  function updateWidgetLayout(id, patch, save=true){
    const w = findWidget(id);
    if(!w) return;
    const vp = editorState.activeViewport;
    if(!canEditViewport(vp)) return;
    w.responsive[vp] = {...w.responsive[vp], ...patch};
    updateCanvasHeight(vp);
    if(save) scheduleSave();
  }

  function findWidget(id){ return pageDraft.widgets.find(w=>w.id===id); }

  function deleteWidget(id){
    pushHistory();
    pageDraft.widgets = pageDraft.widgets.filter(w=>w.id!==id);
    editorState.selectedWidgetId = null;
    scheduleSave();
    render();
  }

  function duplicateWidget(id){
    const w = findWidget(id);
    if(!w) return;
    pushHistory();
    const copy = deepClone(w);
    copy.id = w.type + "_" + Math.random().toString(36).slice(2,8);
    copy.zIndex = getNextZIndex();
    copy.responsive.mobile.x += 18; copy.responsive.mobile.y += 18;
    copy.responsive.desktop.x += 26; copy.responsive.desktop.y += 26;
    pageDraft.widgets.push(copy);
    editorState.selectedWidgetId = copy.id;
    scheduleSave();
    render();
  }

  function bringForward(id){
    const w = findWidget(id);
    if(!w) return;
    pushHistory();
    w.zIndex = getNextZIndex();
    scheduleSave();
    render();
  }

  function sendBackward(id){
    const w = findWidget(id);
    if(!w) return;
    pushHistory();
    w.zIndex = Math.max(1,(w.zIndex||1)-2);
    scheduleSave();
    render();
  }

  function promptImage(id){
    const w = findWidget(id);
    if(!w) return;
    const url = prompt("이미지 URL을 입력하세요.", w.props.imageUrl || "");
    if(url === null) return;
    pushHistory();
    w.props.imageUrl = url.trim();
    scheduleSave();
    render();
  }

  function promptGalleryImage(id, index){
    const w = findWidget(id);
    if(!w) return;
    const current = w.props.images[index] || "";
    const url = prompt("갤러리 이미지 URL을 입력하세요.", current);
    if(url === null) return;
    pushHistory();
    w.props.images[index] = url.trim();
    scheduleSave();
    render();
  }

  function applyVideoUrl(id,url){
    const w = findWidget(id);
    if(!w) return;
    url = (url || "").trim();
    if(isBlockedVideoFileUrl(url)){
      showToast("mp4/mov/webm 같은 영상 파일 링크는 받지 않습니다.");
      return;
    }
    pushHistory();
    const parsed = parseVideoUrl(url);
    w.props.videoUrl = url;
    w.props.provider = parsed.provider;
    w.props.embedUrl = parsed.embedUrl;
    scheduleSave();
    render();
  }

  function parseVideoUrl(url){
    if(!url) return {provider:"",embedUrl:""};
    let id = "";
    try{
      const u = new URL(url);
      if(u.hostname.includes("youtube.com")){
        if(u.pathname.startsWith("/shorts/")) id = u.pathname.split("/")[2] || "";
        else id = u.searchParams.get("v") || "";
      }
      if(u.hostname.includes("youtu.be")){
        id = u.pathname.replace("/","").split("?")[0];
      }
      if(id) return {provider:"youtube",embedUrl:"https://www.youtube.com/embed/"+id};
      if(u.hostname.includes("instagram.com")) return {provider:"instagram",embedUrl:""};
      if(u.hostname.includes("tiktok.com")) return {provider:"tiktok",embedUrl:""};
      if(u.hostname.includes("tv.naver.com")) return {provider:"navertv",embedUrl:""};
    }catch(e){}
    return {provider:"link",embedUrl:""};
  }

  function isBlockedVideoFileUrl(url){
    return /\.(mp4|mov|webm|avi|mkv)(\?.*)?$/i.test(url || "");
  }

  function ensureAllLayouts(){
    pageDraft.widgets.forEach(ensureLayouts);
  }

  function ensureLayouts(w){
    if(!w.responsive) w.responsive = {};
    if(!w.responsive.mobile) w.responsive.mobile = {x:24,y:100,width:340,height:defaultHeight(w.type)};
    if(!w.responsive.desktop) w.responsive.desktop = createDesktopLayoutFromMobile(w);
    if(!w.visible) w.visible = {mobile:true,desktop:true};
  }

  function createDesktopLayoutFromMobile(widget){
    const m = widget.responsive.mobile;
    if(widget.type==="text"){
      return {x:Math.round(m.x*2.2),y:Math.round(m.y*.85),width:Math.min(Math.round(m.width*2.2),760),height:Math.round(m.height*1.25),fontSize:Math.round((m.fontSize||24)*1.35)};
    }
    if(widget.type==="button"){
      return {x:Math.round(m.x*2.2),y:Math.round(m.y*.85),width:Math.min(Math.round(m.width*1.4),260),height:Math.min(Math.round(m.height*1.2),64),fontSize:Math.round((m.fontSize||16)*1.1)};
    }
    return {x:Math.round(m.x*2.2),y:Math.round(m.y*.85),width:Math.min(Math.round(m.width*2),900),height:Math.round(m.height*1.2)};
  }

  function updateCanvasHeight(vp){
    const widgets = pageDraft.widgets.filter(w=>w.visible?.[vp]!==false);
    const min = vp==="mobile" ? 1200 : 1000;
    if(!widgets.length){ pageDraft.canvas[vp].minHeight = min; return; }
    const maxBottom = Math.max(...widgets.map(w=>{
      const l = w.responsive[vp] || {};
      return (l.y||0) + (l.height||0);
    }));
    pageDraft.canvas[vp].minHeight = Math.max(min, maxBottom + 160);
  }

  function saveNow(){
    saveDraft();
    showToast("저장했습니다. 현재 MVP는 브라우저 localStorage 저장입니다.");
  }

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDraft, 600);
  }

  function saveDraft(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(pageDraft));
  }

  function loadDraft(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  function pushHistory(){
    editorState.historyStack.push(JSON.stringify(pageDraft));
    if(editorState.historyStack.length > 50) editorState.historyStack.shift();
    editorState.redoStack = [];
  }

  function undo(){
    if(!editorState.historyStack.length){ showToast("되돌릴 내용이 없습니다."); return; }
    editorState.redoStack.push(JSON.stringify(pageDraft));
    pageDraft = JSON.parse(editorState.historyStack.pop());
    saveDraft();
    render();
  }

  function redo(){
    if(!editorState.redoStack.length){ showToast("다시할 내용이 없습니다."); return; }
    editorState.historyStack.push(JSON.stringify(pageDraft));
    pageDraft = JSON.parse(editorState.redoStack.pop());
    saveDraft();
    render();
  }

  function togglePreview(){
    editorState.preview = !editorState.preview;
    document.getElementById("previewBtn").textContent = editorState.preview ? "편집으로" : "미리보기";
    render();
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>toast.classList.remove("show"),1800);
  }

  function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }
  function escapeAttr(s){ return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function debounce(fn,ms){
    let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args),ms); };
  }

  document.getElementById("saveBtn").onclick = saveNow;
  document.getElementById("previewBtn").onclick = togglePreview;
  document.getElementById("undoBtn").onclick = undo;
  document.getElementById("redoBtn").onclick = redo;

  viewportTabs.addEventListener("click", e=>{
    const btn = e.target.closest(".viewport-tab");
    if(btn) setActiveViewport(btn.dataset.vp);
  });

  document.querySelector(".bottom-bar").addEventListener("click", e=>{
    const btn = e.target.closest(".bottom-btn");
    if(!btn) return;
    editorState.activePanel = btn.dataset.panel;
    renderMobileSheet();
  });

  window.addEventListener("resize", debounce(()=>{
    const old = editorState.deviceType;
    editorState.deviceType = getDeviceType();
    if(editorState.deviceType === "mobile") editorState.activeViewport = "mobile";
    if(old !== editorState.deviceType) render();
  },200));

  updateCanvasHeight("mobile");
  updateCanvasHeight("desktop");
  render();
})();
</script>
</body>
</html>
